<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue</title>
<link rel="stylesheet" href="cards.css">
</head>
<body>
<header class="bar">
  <button id="filters" class="button" type="button" aria-expanded="false" aria-controls="sidebar">Filters</button>
  <input id="q" class="bar__search" type="search" placeholder="Search" aria-label="Search the catalogue">
</header>
<div class="page">
  <aside id="sidebar" class="sidebar" hidden>
    <h2 class="sidebar__title">Filters</h2>
    <label class="sidebar__option"><input type="checkbox"> In stock</label>
    <label class="sidebar__option"><input type="checkbox"> Merino</label>
    <label class="sidebar__option"><input type="checkbox"> Waterproof</label>
  </aside>
  <main id="host" class="host"></main>
</div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet__backdrop"></div>
  <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title" class="sheet__title"></h2>
    <p class="sheet__body"></p>
    <button class="button sheet__close" type="button">Close</button>
  </section>
</div>
<script src="data.js"></script>
<script src="cards.js"></script>
</body>
</html>

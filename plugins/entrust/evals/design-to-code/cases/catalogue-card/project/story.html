<!doctype html>
<meta charset="utf-8">
<title>Card story</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="card.css">
<style>body { padding: 24px; } #host { width: 764px; }</style>
<div id="host"></div>
<script src="data.js"></script>
<script src="card.js"></script>
<script>
  // story.html?data=<name>&w=<width> renders a list of data.js in a container of that width (764 by default).
  const params = new URLSearchParams(location.search);
  const host = document.getElementById("host");
  if (params.get("w")) host.style.width = `${params.get("w")}px`;
  renderCards(host, window.CATALOGUE[params.get("data") || "default"]);
</script>

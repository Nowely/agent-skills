<!doctype html>
<!-- The accepted implementation of the offer card: the answer of this case, never given to the implementer.
     Three modes by the card's own width: a row from 640 px, two rows from 420, a column below. -->
<html lang="en">
<meta charset="utf-8">
<title>Offer card — reference</title>
<style>
  body { margin: 0; padding: 24px; background: #f2f3f5; font-family: sans-serif; color: #1f2329; }
  #host { container-type: inline-size; width: 720px; }
  .card { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-areas: "media main buy";
    column-gap: 20px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #e1e3e8; }
  .media { grid-area: media; width: 96px; height: 96px; border-radius: 8px; background: linear-gradient(135deg, #c9d6ff, #e2e2e2); }
  .main { grid-area: main; min-width: 0; }
  .sku { margin: 0; font-size: 12px; line-height: 16px; color: #7a808c; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { padding: 0 8px; border-radius: 6px; font-size: 13px; line-height: 22px; background: #eef0f3; }
  .badge.new { background: #e3edff; color: #2457c5; }
  .title { margin: 10px 0 0; font-size: 18px; line-height: 24px; font-weight: 600; }
  .specs { display: grid; grid-template-columns: repeat(2, max-content); gap: 4px 24px; margin: 10px 0 0; padding: 0; list-style: none;
    font-size: 14px; line-height: 20px; }
  .specs .unit { color: #7a808c; }
  .buy { grid-area: buy; display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .old { font-size: 13px; line-height: 18px; color: #7a808c; text-decoration: line-through; }
  .price { font-size: 22px; line-height: 28px; font-weight: 700; }
  .stock { margin-top: 4px; font-size: 13px; line-height: 18px; color: #1a8a4a; }
  .add { margin-top: 12px; padding: 0 16px; height: 36px; border: 0; border-radius: 8px; background: #2457c5; color: #fff;
    font: 600 14px/36px sans-serif; white-space: nowrap; }

  @container (max-width: 639px) {
    .card { grid-template-columns: 72px minmax(0, 1fr); grid-template-areas: "media main" "buy buy"; row-gap: 16px; column-gap: 16px; }
    .media { width: 72px; height: 72px; }
    .buy { flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 8px; text-align: left; }
    .old { order: 2; }
    .stock { order: 3; flex-basis: 100%; margin-top: 0; }
    .add { order: 4; margin: 8px 0 0; }
  }
  @container (max-width: 419px) {
    .card { grid-template-columns: minmax(0, 1fr); grid-template-areas: "media" "main" "buy"; padding: 16px; }
    .media { width: 100%; height: 120px; }
    .specs { grid-template-columns: max-content; }
    .add { width: 100%; }
  }
</style>
<div id="host">
  <article class="card">
    <div class="media" role="img" aria-label="Aurora 14 Pro"></div>
    <div class="main">
      <p class="sku">SKU AUR-14P-512</p>
      <div class="badges"><span class="badge new">New</span><span class="badge">Bestseller</span></div>
      <h3 class="title">Aurora 14 Pro</h3>
      <ul class="specs">
        <li>14″ <span class="unit">2880 × 1800</span></li>
        <li>8 cores <span class="unit">3.6 GHz</span></li>
        <li>16 GB <span class="unit">RAM</span></li>
        <li>512 GB <span class="unit">SSD</span></li>
      </ul>
    </div>
    <div class="buy">
      <span class="old">1 699 €</span>
      <span class="price">1 499 €</span>
      <span class="stock">In stock: 12</span>
      <button class="add" type="button">Add to cart</button>
    </div>
  </article>
</div>
</html>

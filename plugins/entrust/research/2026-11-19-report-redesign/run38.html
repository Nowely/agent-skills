<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode workers start a local server by default · Review</title>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --surface-3: #e6e9ee;
  --border: #dce0e6; --border-strong: #c2c8d1;
  --text: #1a1d23; --text-2: #434a56; --text-3: #5f6773;
  --accent: #1f55cc; --accent-strong: #1946ad; --accent-bg: #e8eefb; --accent-border: #a8bdee; --on-accent: #ffffff;
  --ok: #16703a; --ok-bg: #e2f2e7; --ok-bd: #a6d5b5;
  --warn: #875700; --warn-bg: #fcefd2; --warn-bd: #deb768; --warn-line: #c98a00;
  --bad: #b3261e; --bad-bg: #fce7e5; --bad-bd: #eeb0aa; --bad-line: #d4473b;
  --q: #4a4db3; --q-bg: #ebebfa; --q-bd: #bfc1ee; --q-line: #6c6fd6;
  --neutral: #3d4450; --neutral-bg: #eceef2; --neutral-bd: #cdd2da;
  --code-bg: #ffffff; --add-bg: #e9f6ed; --add-num: #d3ecdb; --del-bg: #fdeeec; --del-num: #f7d6d2;
  --num: #565e69; --gap-bg: #f2f4f7; --sel-row: #eef3fd; --code-text: #1f2328;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --pop-shadow: 0 8px 24px rgba(16, 24, 40, .16);
  --hdr: 48px; --tbar: 52px; --panel-w: 440px; --tree-w: 288px;
  --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1115; --surface: #151920; --surface-2: #1b2028; --surface-3: #232a33;
    --border: #2a313b; --border-strong: #3b4451;
    --text: #e4e7ec; --text-2: #b6bdc8; --text-3: #8f98a5;
    --accent: #7ea4ff; --accent-strong: #a3bfff; --accent-bg: #1a2644; --accent-border: #37518f; --on-accent: #0e1115;
    --ok: #5cc479; --ok-bg: #112a1a; --ok-bd: #245a3a;
    --warn: #e3b34f; --warn-bg: #2d2410; --warn-bd: #6a5222; --warn-line: #d39c2a;
    --bad: #ff8b80; --bad-bg: #33171a; --bad-bd: #6d2d30; --bad-line: #e5534b;
    --q: #aeb0ff; --q-bg: #212344; --q-bd: #454989; --q-line: #8b8ef0;
    --neutral: #c5cbd4; --neutral-bg: #222830; --neutral-bd: #3b4451;
    --code-bg: #151920; --add-bg: #16291e; --add-num: #1d3a28; --del-bg: #2e1a1d; --del-num: #452427;
    --num: #a0a8b3; --gap-bg: #1a1f26; --sel-row: #1a2335; --code-text: #e1e4e8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --pop-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1115; --surface: #151920; --surface-2: #1b2028; --surface-3: #232a33;
  --border: #2a313b; --border-strong: #3b4451;
  --text: #e4e7ec; --text-2: #b6bdc8; --text-3: #8f98a5;
  --accent: #7ea4ff; --accent-strong: #a3bfff; --accent-bg: #1a2644; --accent-border: #37518f; --on-accent: #0e1115;
  --ok: #5cc479; --ok-bg: #112a1a; --ok-bd: #245a3a;
  --warn: #e3b34f; --warn-bg: #2d2410; --warn-bd: #6a5222; --warn-line: #d39c2a;
  --bad: #ff8b80; --bad-bg: #33171a; --bad-bd: #6d2d30; --bad-line: #e5534b;
  --q: #aeb0ff; --q-bg: #212344; --q-bd: #454989; --q-line: #8b8ef0;
  --neutral: #c5cbd4; --neutral-bg: #222830; --neutral-bd: #3b4451;
  --code-bg: #151920; --add-bg: #16291e; --add-num: #1d3a28; --del-bg: #2e1a1d; --del-num: #452427;
  --num: #a0a8b3; --gap-bg: #1a1f26; --sel-row: #1a2335; --code-text: #e1e4e8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --pop-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
@media (max-width: 1399px) { :root { --panel-w: 400px; --tree-w: 264px; } }
@media (max-width: 1199px) { :root { --panel-w: 360px; --tree-w: 248px; } }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .9em; }
p code, li code, td code, .prose code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 .25em; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.005em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { padding: 40px; color: var(--text-3); }
.muted { color: var(--text-3); }
.sub { color: var(--text-2); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- masthead + tab bar ---------- */
.masthead { padding: 18px 24px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.kicker { font-size: 12px; color: var(--text-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kicker .sep { color: var(--border-strong); }
.masthead h1 { font-size: 20px; line-height: 1.3; margin-top: 4px; }
.tabbar { position: sticky; top: 0; z-index: 40; height: var(--hdr); background: var(--surface); border-bottom: 1px solid var(--border); }
.tabbar-in { height: 100%; display: flex; align-items: stretch; padding: 0 16px 0 12px; gap: 16px; }
.tabs { display: flex; align-items: stretch; gap: 2px; }
.tab { appearance: none; background: none; border: 0; padding: 0 14px; cursor: pointer; color: var(--text-2); font-weight: 500; position: relative; display: flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tab:focus-visible { outline-offset: -4px; }
.count { font-size: 11.5px; font-weight: 600; min-width: 20px; padding: 0 6px; height: 18px; line-height: 18px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); text-align: center; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .count { background: var(--accent-bg); color: var(--accent-strong); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.progress { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.pbar { width: 72px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: inline-block; }
.pbar > span { display: block; height: 100%; background: var(--accent); }

/* ---------- controls ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.quiet:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .5; cursor: default; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text-2); background: var(--surface); }

/* segmented control: every mode switch and sub-tab */
.seg { display: inline-flex; align-items: stretch; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg > button { appearance: none; border: 0; background: transparent; border-radius: 5px; padding: 0 10px; height: 26px; cursor: pointer; color: var(--text-2); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg > button:hover { color: var(--text); }
.seg > button[aria-pressed="true"], .seg > button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg .count { height: 16px; line-height: 16px; font-size: 11px; background: transparent; padding: 0 2px; min-width: 0; color: var(--text-3); }
.seg > button[aria-pressed="true"] .count, .seg > button[aria-selected="true"] .count { color: var(--text-2); }
.seg .count.zero { opacity: .6; }

/* chips: links to an item by id, nothing else */
.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 4px; font: 600 11.5px/1 var(--mono); color: var(--text-2); background: var(--surface); text-decoration: none; cursor: pointer; white-space: nowrap; vertical-align: 1px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.more-chip { font-size: 12px; color: var(--text-3); background: none; border: 0; padding: 0 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* tags: statuses, nothing else */
.tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; vertical-align: 1px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag.plain::before { display: none; }
.tag.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-bd); }
.tag.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bd); }
.tag.bad { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-bd); }
.tag.q { color: var(--q); background: var(--q-bg); border-color: var(--q-bd); }
.tag.neutral { color: var(--neutral); background: var(--neutral-bg); border-color: var(--neutral-bd); }
.tag.open { color: var(--text-2); background: transparent; border-color: var(--border-strong); }
.tag.open::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.tag.dashed { color: var(--text-2); background: transparent; border: 1px dashed var(--border-strong); }
.tag.dashed::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }

/* ---------- frame: main column + side panel ---------- */
.frame { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); align-items: start; }
.col { padding: 22px 28px 64px; min-width: 0; }
.col-narrow { max-width: 900px; }
.panel { position: sticky; top: var(--hdr); height: calc(100vh - var(--hdr)); overflow: auto; border-left: 1px solid var(--border); background: var(--surface); overscroll-behavior: contain; }
.panel-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 18px 10px; }
.panel-kicker { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.panel-title { font-size: 15px; margin-top: 3px; line-height: 1.35; overflow-wrap: anywhere; }
.panel-body { padding: 4px 18px 40px; }
.psec { padding: 14px 0; border-bottom: 1px solid var(--border); }
.psec:last-child { border-bottom: 0; }
.psec > h3 { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.psec > h3 .btn { margin-left: auto; }
.psec p { margin: 0 0 6px; }
.empty { color: var(--text-3); padding: 28px 0; text-align: left; }
.empty strong { color: var(--text-2); display: block; margin-bottom: 4px; font-weight: 600; }
dl.kv { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; }
dl.kv dt { color: var(--text-3); font-size: 12.5px; padding-top: 1px; }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: break-word; }
.section-h { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 10px; }
.section-h:first-child { margin-top: 0; }
.section-h h2 { font-size: 15px; }
.section-h .muted { font-size: 12.5px; }
.section-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ---------- summary ---------- */
.lead { font-size: 16px; line-height: 1.55; font-weight: 500; margin: 0 0 10px; max-width: 860px; }
.bullets { margin: 0 0 4px; padding-left: 20px; max-width: 860px; color: var(--text-2); }
.bullets li { margin: 3px 0; }
.statrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); margin-bottom: 22px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); }
.stat .add { color: var(--ok); } .stat .del { color: var(--bad); }
.statrow .grow { flex: 1 1 220px; min-width: 200px; }
.statrow .cta { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.vbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-3); }
.vbar > span { display: block; height: 100%; }
.vbar.small { height: 6px; width: 96px; }
.s-keep { background: var(--border-strong); } .s-fix { background: var(--warn-line); } .s-remove { background: var(--bad-line); } .s-question { background: var(--q-line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin-top: 6px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.rec { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; background: var(--surface); padding: 12px 16px; margin: 16px 0 0; max-width: 900px; }
.rec h3 { font-size: 12px; color: var(--text-3); margin-bottom: 4px; font-weight: 600; }
.rec p { margin: 0; }
ol.steps { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; padding: 8px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
ol.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); color: var(--text-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
ol.steps li:hover { background: var(--surface-2); }
ol.steps li.sel { background: var(--accent-bg); }
ol.steps .chips { margin-left: 6px; }

/* ---------- tables ---------- */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.tbl th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.selectable { cursor: pointer; }
.tbl tr.selectable:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-bg); }
.tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tbl .id { font: 600 12px var(--mono); color: var(--text-2); white-space: nowrap; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .why { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.tbl .why b { font-weight: 600; color: var(--text-3); font-size: 12px; margin-right: 4px; }
.status-cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.status-cell .line { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.unit-name { font: 600 13px var(--mono); overflow-wrap: anywhere; }
.unit-jobs { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

/* ---------- cards: one shell ---------- */
.group-h { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
.group-h:first-child { margin-top: 4px; }
.group-h .muted { font-weight: 400; font-size: 12.5px; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; position: relative; scroll-margin-top: calc(var(--hdr) + 16px); }
.card.selectable { cursor: pointer; }
.card.selectable:hover { border-color: var(--border-strong); }
.card.sel { border-color: var(--accent-border); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.card.child { margin-left: 28px; }
.card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-id { font: 700 12.5px var(--mono); color: var(--text); }
.card-type { font-size: 12.5px; color: var(--text-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .tag, .card-head .status { margin-left: auto; }
.card-title { font-size: 14.5px; font-weight: 600; margin: 6px 0 0; line-height: 1.45; }
.card-title.q { font-weight: 500; }
.card-at { font: 12px var(--mono); color: var(--text-3); margin-top: 4px; overflow-wrap: break-word; }
.card-text { color: var(--text-2); margin: 8px 0 0; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-fix { margin: 10px 0 0; padding: 8px 12px; background: var(--surface-2); border-radius: 6px; color: var(--text-2); }
.card-fix b { color: var(--text); font-weight: 600; margin-right: 4px; }
.card-rec { margin: 10px 0 0; padding: 8px 12px; border: 1px dashed var(--border-strong); border-radius: 6px; color: var(--text-2); font-size: 13px; }
.card-rec b { color: var(--text); font-weight: 600; }
.card-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--text-3); }
.card-foot .lbl { margin-right: 2px; }
.card .compact { display: none; }
.card.settled:not(.open-full) .full { display: none; }
.card.settled:not(.open-full) .compact { display: flex; }
.card.settled:not(.open-full) { padding: 9px 14px; background: var(--surface-2); }
.compact { align-items: center; gap: 10px; min-width: 0; }
.compact .ctitle { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.compact .answer { color: var(--text-3); font-size: 12.5px; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* choice: variants + Other — one reversible decision */
.choice { border: 0; margin: 12px 0 0; padding: 0; min-width: 0; }
.choice legend { font-size: 12px; color: var(--text-3); font-weight: 600; padding: 0; margin-bottom: 6px; }
.opts { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.opt { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px 8px; padding: 8px 12px; cursor: pointer; border-top: 1px solid var(--border); background: var(--surface); align-items: start; }
.opt:first-child { border-top: 0; }
.opt:hover { background: var(--surface-2); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
.opt .ol { font-weight: 500; }
.opt .os { grid-column: 2; font-size: 12.5px; color: var(--text-3); }
.opt.on { background: var(--accent-bg); }
.opt .rec-mark { font-size: 11.5px; color: var(--text-3); margin-left: 6px; font-weight: 400; }
.other-wrap { grid-column: 1 / -1; padding: 2px 0 2px 28px; }
.other-wrap.solo { padding: 0; }
textarea.answer { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 9px; background: var(--surface); line-height: 1.45; }
textarea.answer:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.choice-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.choice-actions .hint { font-size: 12px; color: var(--text-3); margin-left: auto; }
.zones { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.zones label { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }

/* compact choice (in the code margin note) */
.pills { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.pill { appearance: none; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; }
.pill:hover { background: var(--surface-2); }
.pill[aria-checked="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }

/* ---------- code tab ---------- */
.toolbar { position: sticky; top: var(--hdr); z-index: 30; height: var(--tbar); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 16px; min-width: 0; }

.toolbar .pos b { font-variant-numeric: tabular-nums; }
.toolbar .token { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 9px; border-radius: 13px; background: var(--accent-bg); color: var(--accent-strong); font-size: 12.5px; white-space: nowrap; }
.toolbar .token button { border: 0; background: none; color: inherit; cursor: pointer; width: 20px; height: 20px; border-radius: 10px; }
.toolbar .token button:hover { background: var(--surface); }
.pop { position: relative; }
.pop-menu { position: absolute; top: 34px; left: 0; z-index: 50; min-width: 250px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--pop-shadow); padding: 6px; }
.pop-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.pop-menu label:hover { background: var(--surface-2); }
.pop-menu label .muted { margin-left: auto; font-size: 12px; }
.pop-menu .rules { font-size: 12px; color: var(--text-3); padding: 6px 8px 4px; border-top: 1px solid var(--border); margin-top: 4px; line-height: 1.45; }
.pop-menu input { accent-color: var(--accent); }

.frame.code { grid-template-columns: var(--tree-w) minmax(0, 1fr) var(--panel-w); }
.frame.code.no-tree { grid-template-columns: minmax(0, 1fr) var(--panel-w); }
.frame.code .panel, .frame.code .tree { top: calc(var(--hdr) + var(--tbar)); height: calc(100vh - var(--hdr) - var(--tbar)); }
.tree { position: sticky; overflow: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 8px 0 40px; overscroll-behavior: contain; }
.tree-head { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px 14px; font-size: 12px; color: var(--text-3); font-weight: 600; }
.tree-head .btn { margin-left: auto; }
.tnode { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: start; width: 100%; text-align: left; border: 0; background: none; padding: 4px 10px 4px calc(8px + var(--d, 0) * 11px); cursor: pointer; font-size: 13px; line-height: 1.35; color: var(--text); border-radius: 0; }
.tnode:hover { background: var(--surface-2); }
.tnode.t-dir { color: var(--text-2); font-size: 12.5px; }
.tnode.t-dir .tn-name { font-family: var(--mono); font-size: 12px; }
.tnode .caret { color: var(--text-3); font-size: 10px; padding-top: 3px; transition: transform .1s; }
.tnode.t-dir[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.tn-name { overflow-wrap: anywhere; word-break: normal; min-width: 0; }
.tnode.t-file .tn-name { font-family: var(--mono); font-size: 12.5px; }
.tn-main { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; min-width: 0; }
.tn-main .tn-name { flex: 0 1 auto; }
.tn-main .tn-meta { margin-left: auto; }
.tn-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; padding-top: 1px; font-variant-numeric: tabular-nums; }
.tn-meta .a { color: var(--ok); } .tn-meta .d { color: var(--bad); }
.tnode.t-file.dim { color: var(--text-3); }
.tnode.t-file.cur { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
.tn-st { font: 600 10.5px var(--mono); color: var(--text-3); padding-top: 2px; text-align: center; }
.mark { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10.5px; font-weight: 700; color: #fff; }
.mark.fix { background: var(--warn-line); color: #1a1300; } .mark.remove { background: var(--bad-line); } .mark.question { background: var(--q-line); }
.mark.done { background: transparent; color: var(--text-3); box-shadow: inset 0 0 0 1px var(--border-strong); }

.files { padding: 14px 18px 120px; min-width: 0; overflow-anchor: auto; }
.file { border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); margin-bottom: 14px; scroll-margin-top: calc(var(--hdr) + var(--tbar) + 8px); }
.fh { position: sticky; top: calc(var(--hdr) + var(--tbar)); z-index: 10; display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; min-width: 0; }
.file.collapsed .fh { border-bottom: 0; border-radius: 8px; }
.fh .fold-btn { flex: none; }
.fh .path { font: 13px var(--mono); min-width: 0; overflow-wrap: break-word; }
.fh .path .dir { color: var(--text-3); }
.fh .path b { font-weight: 600; }
.fh .meta { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.fh .a { color: var(--ok); font-weight: 600; } .fh .d { color: var(--bad); font-weight: 600; }
.file.collapsed .fb { display: none; }
.fb.pending { background: repeating-linear-gradient(180deg, var(--code-bg) 0 20px, var(--surface-2) 20px 21px); }
.hidden-note { margin: 4px 0 0; padding: 14px 16px; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--text-2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

table.diff { width: 100%; border-collapse: collapse; table-layout: fixed; font: 12.5px/20px var(--mono); color: var(--code-text); }
table.diff col.c-num { width: 48px; }
table.diff td { padding: 0; vertical-align: top; }
td.lo, td.ln { text-align: right; color: var(--num); padding: 0 8px 0 4px !important; user-select: none; font-size: 11.5px; }
td.lo { border-right: 0; }
td.ln { border-right: 1px solid var(--border); }
td.ln button, td.lo button { all: unset; cursor: pointer; display: block; width: 100%; text-align: right; border-radius: 3px; }
td.ln button:hover, td.lo button:hover { color: var(--accent); text-decoration: underline; }
td.ln button:focus-visible, td.lo button:focus-visible { outline: 2px solid var(--accent); }
td.cd { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 12px 0 22px !important; text-indent: -12px; }
td.cd .sg { display: inline-block; width: 12px; text-indent: 0; color: var(--text-3); user-select: none; }
tr.a td.cd { background: var(--add-bg); } tr.a td.lo, tr.a td.ln { background: var(--add-num); }
tr.d td.cd { background: var(--del-bg); } tr.d td.lo, tr.d td.ln { background: var(--del-num); }
tr.a .sg { color: var(--ok); } tr.d .sg { color: var(--bad); }
tr.r { scroll-margin-top: calc(var(--hdr) + var(--tbar) + 60px); }
/* the frame of a block that needs attention */
tr.fx td.cd { box-shadow: inset 3px 0 0 var(--vline), inset -1px 0 0 var(--vline); }
tr.fx.ft td.cd { box-shadow: inset 3px 0 0 var(--vline), inset -1px 0 0 var(--vline), inset 0 1px 0 var(--vline); }
tr.fx.fb2 td.cd { box-shadow: inset 3px 0 0 var(--vline), inset -1px 0 0 var(--vline), inset 0 -1px 0 var(--vline); }
tr.fx.ft.fb2 td.cd { box-shadow: inset 3px 0 0 var(--vline), inset -1px 0 0 var(--vline), inset 0 1px 0 var(--vline), inset 0 -1px 0 var(--vline); }
.v-fix { --vline: var(--warn-line); } .v-remove { --vline: var(--bad-line); } .v-question { --vline: var(--q-line); } .v-keep { --vline: var(--border-strong); }
tr.fx.decided { --vline: var(--border-strong); }
tr.selb td.lo, tr.selb td.ln { box-shadow: inset 0 0 0 999px rgba(31, 85, 204, .10); }
tr.r.kept-click { cursor: pointer; }
tr.lnsel td { box-shadow: inset 0 0 0 999px rgba(212, 167, 44, .16) !important; }
tr.gap td, tr.fold td { background: var(--gap-bg); color: var(--text-3); font: 12px/26px var(--sans); }
tr.gap td.gcell { padding: 0 12px !important; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
tr.fold td { padding: 0 !important; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
tr.fold button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 12px; cursor: pointer; color: var(--text-2); }
tr.fold button:hover { background: var(--accent-bg); color: var(--accent-strong); }
tr.fold button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.fold .dots { font-family: var(--mono); letter-spacing: 1px; color: var(--text-3); }
tr.fold .fold-blocks { color: var(--text-3); }
tr.note-row td { padding: 0 !important; }
.note { margin: 12px 0 0 96px; border: 1px solid var(--vline); border-left-width: 3px; border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--surface); font-family: var(--sans); font-size: 13px; line-height: 1.45; color: var(--text); white-space: normal; cursor: pointer; }
.note.decided { border-color: var(--border-strong); }
.note.sel { box-shadow: 0 0 0 2px var(--accent-border); }
.note-top { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); min-width: 0; }
.note-top .bid { font: 700 12px var(--mono); }
.note-top .does { color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.note-card { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 12px; align-items: start; }
.note-card + .note-card { border-top: 1px dashed var(--border); }
.note-card .cid { font: 700 12px/22px var(--mono); }
.note-card .ctitle { font-weight: 600; line-height: 1.4; padding-top: 2px; }
.note-card .cfix { grid-column: 2 / 4; color: var(--text-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note-card .cfix b { color: var(--text-3); font-weight: 600; }
.note-card .pills { grid-column: 2 / 4; margin-top: 4px; }
.note-card .st { grid-column: 3; grid-row: 1; }
tr.cont-row td { padding: 0 !important; }
.cont { margin: 4px 0 0 96px; font: 12px/20px var(--sans); color: var(--text-3); }
.cont b { font-family: var(--mono); color: var(--text-2); }
/* line comments */
tr.lc-row td { padding: 0 !important; background: var(--surface-2); }
.lc { margin: 6px 12px 6px 96px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); font: 13px/1.45 var(--sans); white-space: normal; color: var(--text); }
.lc .lc-h { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; margin-bottom: 4px; }
.lc .lc-h .btn { margin-left: auto; }
.lc .lc-t { white-space: pre-wrap; overflow-wrap: anywhere; }
.lc textarea { width: 100%; min-height: 60px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; background: var(--surface); resize: vertical; }
.lc .lc-a { display: flex; gap: 8px; margin-top: 6px; }

/* excerpts in the panel */
.excerpt { border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin: 8px 0 10px; background: var(--code-bg); }
.ex-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12px; min-width: 0; }
.ex-h .ex-path { font-family: var(--mono); color: var(--text-2); min-width: 0; overflow-wrap: break-word; flex: 1; }
.ex-h .ex-path b { color: var(--text); }
.ex-does { padding: 6px 10px; font-size: 12.5px; color: var(--text-2); border-bottom: 1px solid var(--border); background: var(--surface); }
.excerpt table.diff { font-size: 11.5px; line-height: 18px; }
.excerpt table.diff col.c-num { width: 38px; }
.excerpt td.cd { padding-left: 18px !important; text-indent: -10px; }
.excerpt td.cd .sg { width: 10px; }
.excerpt tr.hit td { box-shadow: inset 0 0 0 999px rgba(212, 167, 44, .18); }
.excerpt .ex-more { padding: 4px 10px; border-top: 1px solid var(--border); background: var(--surface-2); }
.excerpt.outside { padding: 8px 10px; font-size: 12.5px; color: var(--text-3); }

.mini { border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; margin: 6px 0; background: var(--surface); }

.mini .mh .tag { margin-left: auto; }
.mini .mt { font-weight: 600; margin-top: 3px; }
.mini .mx { color: var(--text-2); font-size: 13px; margin-top: 3px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain > li { padding: 4px 0; }
ul.dash { margin: 0; padding-left: 18px; }
ul.dash > li { margin: 2px 0; }
.srcs { font-size: 12px; color: var(--text-3); }
.lc-list .lc-item { padding: 8px 0; border-top: 1px solid var(--border); }

.lc-item .where { font: 12px var(--mono); color: var(--text-3); display: flex; align-items: center; gap: 6px; }

.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; color: var(--text-2); align-items: center; }

/* ---------- details ---------- */
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.box { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 12px 16px; }
.box h3 { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.box p { margin: 0 0 4px; }
.prose p { margin: 0 0 8px; max-width: 860px; }
.prose ul { margin: 0 0 8px; padding-left: 20px; max-width: 860px; }
.graph-wrap { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: auto; padding: 12px; }

.gnode rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; }

.gnode text { fill: var(--text); font: 600 12px var(--mono); }

.gnode { cursor: pointer; }
.gnode .gbar { stroke: none; }
.gedge { fill: none; stroke: var(--border-strong); stroke-width: 1.2; }
.garrow { fill: var(--border-strong); }
svg.hovering .gedge { opacity: .18; }
svg.hovering .gnode { opacity: .35; }
svg.hovering .gedge.hl { opacity: 1; stroke: var(--accent); stroke-width: 2; }
svg.hovering .gnode.hl { opacity: 1; }
svg.hovering .gnode.hl rect { stroke: var(--accent); }
.gnode.sel rect { stroke: var(--accent); stroke-width: 2; }
.check-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; }
.check-item .n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text-2); }
.check-item ol { margin: 4px 0; padding-left: 18px; }
.check-item .lbl { font-size: 12px; color: var(--text-3); font-weight: 600; margin-right: 4px; }

/* ---------- smaller screens ---------- */
@media (max-width: 1150px) {
  .frame.code { grid-template-columns: minmax(0, 1fr) var(--panel-w); }
  .frame.code .tree { position: fixed; left: 0; z-index: 35; width: min(320px, 85vw); box-shadow: var(--pop-shadow); }
  .toolbar input[type="search"] { width: 150px; }
  .toolbar select { max-width: 170px; }
  .progress .ptext { display: none; }
}
@media (max-width: 860px) {
  .frame, .frame.code, .frame.code.no-tree { grid-template-columns: minmax(0, 1fr); }
  .panel, .frame.code .panel { position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); }
  .col { padding: 16px; }
  .files { padding: 10px; }
  .toolbar { height: auto; flex-wrap: wrap; padding: 8px 12px; position: static; }
  .fh { top: var(--hdr); }
  .twocol { grid-template-columns: 1fr; }
  .note, .lc, .cont { margin-left: 8px; }
  .tabbar-in { overflow-x: auto; }
  .progress { display: none; }
  .tbl .hide-sm { display: none; }
}
@media print { .tabbar, .toolbar, .tree, .panel { display: none; } .frame { display: block; } }

till resolves the model and resume leaves `opencode serve` running: the signal handlers are installed after the server starts (driver.mjs:963 against 1077)\n- the new env flag ENTRUST_OPENCODE_LOCAL does nothing the endpoint-stripping beside it does not already do\n- about a third of the diff is another theme: named-model routing text and a seven-case eval suite that no source but the author's account asks for; one recorded defect (E101) is fixed in passing and its entry is left open\n- not verified: the real `opencode serve` contract (announce line, credential variables) is not in the tree, and continuation across server processes and several concurrent servers were not shown (tests reuse one fake; the author's live runs were two single calls)","now":"driver.mjs and status.mjs each call startLocalServer when connection() returns {local:true}: it spawns `opencode serve --hostname 127.0.0.1 --port 0` with generated Basic credentials in the child's environment, reads \"server listening on \u003curl>\" from its output, checks the URL is loopback, polls /global/health, and the caller closes it (SIGTERM, then SIGKILL after 2 s) in `finally`. agent-run.mjs --new records `localServer:true` when no URL is configured and, on every launch of that record, deletes the endpoint env and sets ENTRUST_OPENCODE_LOCAL=1. Reports and session records carry `serverMode`; resume matches `local` records by mode and ignores the ephemeral URL.","target":"The same shape, with these corrections:\n- no ENTRUST_OPENCODE_LOCAL: stripping ENTRUST_OPENCODE_URL and ENTRUST_OPENCODE_CONNECTION for a `localServer` record already makes connection() answer local\n- the server's stop is armed before it starts: a signal handler inside startLocalServer that kills the child and re-raises, released by the driver when it installs its own handlers (an `exit` hook alone does not run on a signal's default action)\nThe launcher keeps its own pin of the endpoint (it imports no opencode module). Routing text, its eval suite, the README rewrite and the git filter go to their own changes unless the owner says otherwise.","recommendation":"Fix in place: arm the server's stop before it starts, drop the redundant flag, settle E101 and the swarm usage text; take the routing theme out into its own change unless the owner wants it here.","steps":[{"text":"Arm the server's stop before it starts: a handler in startLocalServer that kills the child and re-raises, released when the driver installs its own handlers; test that a SIGTERM during startup leaves no server","findings":["2","5"]},{"text":"Remove ENTRUST_OPENCODE_LOCAL (config.mjs:38, agent-run.mjs:102); keep the endpoint stripping","findings":["1"]},{"text":"If the README rewrite stays in this change, remove E101 from ISSUES.md and name it in the changelog; otherwise move the rewrite out. Update swarm.mjs:47","findings":["3","4"]},{"text":"Ask the owner whether the named-model routing text, the seven eval cases and the package.test filter belong here; if not, move them to their own change","findings":[]}],"coverage":"Read (after the critic and verifier): the whole diff, agent-run.mjs imports and 585-611, driver.mjs 1068-1077, the head and base files it touches around the changed lines (agent-run.mjs 60-135 and 420-440 and 580-610, opencode driver.mjs 730-800, 950-970, 1055-1110, config.mjs, status.mjs, local-server.mjs, client.mjs header), AGENT.md, the author's description and changelog, ISSUES.md E101, swarm.mjs:44-50, the routing eval prompts. Not read: the rest of driver.mjs and client.mjs, v2-client.mjs behaviour under a local server, the full opencode.test.mjs, the installed OpenCode CLI (not present; its output format and credential variables are unknown), how OpenCode shares a data directory between concurrent servers. Nothing was run: no tests, no probes, no eval suite; the author's reported results (68/68, 50/50, 8/8, live DEEPSEEK_OK and GLM_OK) are unchecked. Binary changes and file modes: none in the diff. No git wa ns through the server, so they must not lose it). An `exit` hook alone does not run when a signal takes its default action. Add the test in finding 5. A SIGKILL by the keeper cannot be covered and stays a known limit.","breaks":["2"],"untested":[],"place":{"text":"plugins/entrust/plugin/skills/opencode/scripts/driver.mjs:963","file":29,"line":963,"end":963,"base":false}},{"id":"3","title":"E101 is fixed in the README while its ISSUES.md entry stays and the changelog does not name it","direction":"design","evidence":"read","at":"plugins/entrust/evals/README.md:117","what":"The rewrite of the \"no harness\" paragraph is the fix E101 asks for (ISSUES.md:156-171 at the head, same sentence and line). AGENT.md: \"Remove the entry when the fix lands and the changelog names it.\" The diff leaves ISSUES.md untouched and the changelog does not mention the README; the pull request description still lists E101 as open. The fix belongs to a different theme than the task (AGENT.md: one theme per commit).","shown_by":"ISSUES.md E101 quoted text against the new README lines 117-118","fix":"If the README part stays: remove the E101 entry and name it in the changelog. If the routing theme moves out (question 3), move the README rewrite with it or give E101 its own change.","breaks":[],"untested":[],"place":{"text":"plugins/entrust/evals/README.md:117","file":2,"line":117,"end":117,"base":false}},{"id":"4","title":"swarm usage text still says OpenCode needs an existing server connection","direction":"design","evidence":"read","at":"plugins/entrust/plugin/skills/swarm/scripts/swarm.mjs:47","what":"\"OpenCode defaults to concurrency 2, needs its existing server connection, and requires a pinned provider/model\" is now wrong: a default run starts its own server. The file is outside the diff; the other usage text (agent-run.mjs:138) and pages were updated.","shown_by":"the line read against local-server.mjs and config.mjs:45-48","fix":"Say that it starts a local server unless an endpoint nge) or should local workers share one server that outlives them (the independent target)? Per worker means N processes at a fan-out and a startup of up to 15 s each, and unknown behaviour when several servers share one OpenCode data directory; shared needs a start owner and a stop rule. The task text does not say; the owner decides.","kind":"decision","context":[],"variants":[],"recommendation":null,"remainingEvidence":[],"parent":null,"zones":[],"children":[]},{"id":"3","at":"plugins/entrust/plugin/skills/opencode/SKILL.md:21","place":{"text":"plugins/entrust/plugin/skills/opencode/SKILL.md:21","file":26,"line":21,"end":21,"base":false},"text":"Is named-model routing (description rewrite, \"Route named models\", seven eval cases, README and changelog lines) wanted in this change? Only the author's account states it; AGENT.md asks for one theme per commit.","kind":"decision","context":[],"variants":[],"recommendation":null,"remainingEvidence":[],"parent":null,"zones":[],"children":[]},{"id":"4","at":"plugins/entrust/evals/package.test.mjs:133","place":{"text":"plugins/entrust/evals/package.test.mjs:133","file":18,"line":133,"end":133,"base":false},"text":"Why must the payload file lists skip tracked paths missing from the tree? No stated premise; a deletion staged without a commit is one guess. The pull request description does not mention it.","kind":"fact","context":[],"variants":[],"recommendation":null,"remainingEvidence":[],"parent":null,"zones":[],"children":[]}],"checks":[{"from":"A shell with ENTRUST_OPENCODE_URL and ENTRUST_OPENCODE_CONNECTION unset and `opencode` installed","do":["start a worker through the launcher","send it SIGTERM about 1 s after the process starts, before any model call","list processes for `opencode serve`"],"expect":"no `opencode serve` remains","requirements":["2"]},{"from":"A finished local worker report","do":["export ENTRUST_OPENCODE_URL to some other server","continue the worker through the launcher with a fresh report path"]," 0,1,1,0,"\u003cspan class=\"t1\"># Evals for entrust\u003c/span>"],[0,2,2,0,""],[0,3,3,0,"Two kinds of check live here. The suites run offline against a fixture and are meant to stay green."],[2,4,null,7,"\u003cspan class=\"t1\">`evals.json`\u003c/span> holds the trigger and behaviour cases: the prompts this skill must fire on, the prompts it"],[2,5,null,7,"must stay silent on, and the things it must get right once it has fired. Those are run by hand."],[1,null,4,7,"\u003cspan class=\"t1\">`evals.json`\u003c/span> holds the legacy Codex trigger cases for manual transcript checks. \u003cspan class=\"t1\">`opencode-routing/`\u003c/span> is a"],[1,null,5,7,"Claude Code plugin-eval suite for OpenCode's real skill trigger: it checks prompts that must fire and"],[1,null,6,7,"prompts that must stay silent."],[0,6,7,0,""],[0,7,8,0,"\u003cspan class=\"t1\">## Running the suites\u003c/span>"],[0,8,9,0,""]]},{"o":113,"n":114,"rows":[[0,113,114,0,""],[0,114,115,0,"\u003cspan class=\"t1\">## Running the trigger cases\u003c/span>"],[0,115,116,0,""],[2,116,null,8,"There is no harness for those. \u003cspan class=\"t1\">`claude plugin eval`\u003c/span> exists in the documentation but is early access and"],[2,117,null,8,"absent from this build — \u003cspan class=\"t1\">`claude plugin --help`\u003c/span> lists no \u003cspan class=\"t1\">`eval`\u003c/span> subcommand. Another installed skill keeps"],[2,118,null,8,"its \u003cspan class=\"t1\">`evals.json`\u003c/span> as a document for the same reason."],[1,null,117,8,"The Codex cases in \u003cspan class=\"t1\">`evals.json`\u003c/span> use a legacy document format that \u003cspan class=\"t1\">`claude plugin eval`\u003c/span> does not read."],[1,null,118,8,"Run them in a fresh session and inspect actual Skill calls in the transcript as below."],[0,119,119,0,""],[0,120,120,0,"What does work is observing a real invocation. Give an agent the case prompt verbatim, with no hint that"],[0,121,121,0,"it is a test, then read its transcript rather than its self-report:"]]},{"o":130,"n":130,"rows":[[0,130,130,0,"every transcript as part of the available-skills listing in the system prompt, and again throughout this"],[0,131,131,0,"repository's own prose, so a skill that never fired still matches."],[0,132,132,0,""],[1,null,133,9,"The OpenCode cases use the current \u003cspan class=\"t1\">`claude plugin eval`\u003c/span> format. The repository keeps working eval data"],[1,null,134,9,"beside the installed plugin, so stage a temporary plugin copy and run the seven cases with Skill as the"],[1,null,135,9,"only permitted tool; the one-turn cap records routing before worker launch, without spending provider"],[1,null,136,9,"tokens:"],[1,null,137,9,""],[1,null,138,9,"```bash"],[1,null,139,9,"tmp=$(mktemp -d)"],[1,null,140,9,"cp -R plugins/entrust/plugin &quot;$tmp/plugin&quot;"],[1,null,141,9,"mkdir -p &quot;$tmp/plugin/evals/opencode-routing&quot;"],[1,null,142,9,"cp -R plugins/entrust/evals/opencode-routing/. &quot;$tmp/plugin/evals/opencode-routing/&quot;"],[1,null,143,9,"claude plugin eval &quot;$tmp/plugin&quot; --eval-dir evals/opencode-routing --ablation none \\"],[1,null,144,9,"  --model haiku --max-cost-usd 1 --no-publish --trust-plugin"],[1,null,145,9,"```"],[1,null,146,9,""],[1,null,147,9,"The positive cases grade an actual \u003cspan class=\"t1\">`Skill`\u003c/span> call naming \u003cspan class=\"t1\">`entrust:opencode`\u003c/span>; the negative cases grade"],[1,null,148,9,"that no such call occurred. Worker model selection remains covered by the offline adapter evals and"],[1,null,149,9,"real-model checks."],[1,null,150,9,""],[0,133,151,0,"Ask the agent to self-report as well, but treat that as a cross-check only. An agent's account of which"],[0,134,152,0,"tools it used is exactly the kind of claim this skill exists to distrust."],[0,135,153,0,""]]}]},{"path":"plugins/entrust/evals/opencode-routing/explicit-opencode-ru/graders/opencode-fired.md","status":"A","purpose":"docs","add":6,"del":0,"hunks":[{" <script>
(() => {
"use strict";
performance.mark("app-start");
const D = JSON.parse(document.getElementById("data").textContent);
const W = (k) => D.words[k] ?? k;
const app = document.getElementById("app");

// ---------------------------------------------------------------- helpers
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const prose = (v) => esc(v).replace(/`([^`]+)`/g, "<code>$1</code>");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const n = (x) => Number(x).toLocaleString("en-US");
const plural = (k, one, many = one + "s") => `${n(k)} ${k === 1 ? one : many}`;
function textBlock(v, cls = "") {
  let out = "", list = [];
  const flush = () => { if (list.length) { out += `<ul class="bullets">${list.map((l) => `<li>${prose(l)}</li>`).join("")}</ul>`; list = []; } };
  for (const line of String(v ?? "").split("\n")) {
    if (/^\s*-\s+/.test(line)) list.push(line.replace(/^\s*-\s+/, ""));
    else { flush(); if (line.trim()) out += `<p class="${cls}">${prose(line)}</p>`; }
  }
  flush();
  return out;
}
const splitPath = (p) => { const i = p.lastIndexOf("/"); return [p.slice(0, i + 1), p.slice(i + 1)]; };
const slashBreaks = (s) => esc(s).replace(/\//g, "/<wbr>");
const pathHtml = (p) => { const [d, b] = splitPath(p); return `<span class="dir">${slashBreaks(d)}</span><b>${esc(b)}</b>`; };

// ---------------------------------------------------------------- indices
const B = D.blocks, F = D.files;
const blk = (id) => B[id - 1];
const reqById = new Map(D.requirements.map((r) => [r.id, r]));
const fileBlocks = F.map(() => []);
for (const b of B) fileBlocks[b.file].push(b);
const CARDS = [], cardByKey = new Map();
const addCard = (c) => { c.blocks = []; CARDS.push(c); cardByKey.set(c.key, c); };
for (const q of D.questions) addCard({ key: "q" + q.id, label: "Q" + q.id, type: "q", kind: q.kind, ref: q });
for (const f of D.findings) addCard({ key: "f" + f.id, label: "F" + f.id, type: "f", kind: "finding", ref: f });
for (const i of D.ideas) addCard({ key: "i" + i.id, label: "I" + i.id, type: "i", kind: "idea", ref: i });
for (const b of B) {
  for (const f of b.findings) cardByKey.get("f" + f)?.blocks.push(b.id);
  for (const q of b.questions) cardByKey.get("q" + q)?.blocks.push(b.id);
}
const blockCards = (b) => [...b.findings.map((f) => "f" + f), ...b.questions.map((q) => "q" + q)].filter((k) => cardByKey.has(k));
// where each block starts, for ordering and for j/k
const firstPos = {};
F.forEach((f, fi) => f.hunks.forEach((h, hi) => h.rows.forEach((r, ri) => { if (r[3] && !firstPos[r[3]]) firstPos[r[3]] = [fi, hi, ri]; })));
const ORDER = B.filter((b) => firstPos[b.id]).sort((a, b) => { const x = firstPos[a.id], y = firstPos[b.id]; return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; });
const ATTN = ORDER.filter((b) => b.verdict !== "keep");
// a place inside the diff: which row, and which block owns it
function rowAt(place) {
  if (!place || place.file == null) return null;
  const f = F[place.file];
  for (let hi = 0; hi < f.hunks.length; hi++) {
    const rows = f.hunks[hi].rows;
    for (let ri = 0; ri < rows.length; ri++) {
      const r = rows[ri];
      if (place.base ? (r[0] !== 1 && r[1] === place.line) : (r[0] !== 2 && r[2] === place.line)) return { fi: place.file, hi, ri, row: r };
    }
  }
  return null;
}
for (const c of CARDS) { const at = rowAt(c.ref.place); c.placeRow = at; c.placeBlock = at?.row[3] || null; }

// ---------------------------------------------------------------- state (memory only)
const S = {
  dec: {}, lc: {}, lcEdit: null, tab: "summary",
  sel: { summary: null, decisions: null, code: null, details: null },
  sub: { decisions: "all", details: "structure" }, structView: "table", more: {},
  code: { mode: "attention", purposes: new Set(D.purposes), req: "", unit: "", q: "", expanded: new Set(), collapsed: new Set(), pinned: new Set(), tree: window.innerWidth > 1150, dirsClosed: new Set() },
  scroll: {}, theme: "auto", rendered: {},
};
const OPEN = { open: true, label: "Open", cls: "open" };
function decOf(key) { return S.dec[key] ?? (S.dec[key] = { choice: null, text: "", deferred: false, zones: {} }); }
function statusOf(key) {
  const c = cardByKey.get(key), d = S.dec[key];
  if (c.ref.parent) {
    const p = S.dec["q" + c.ref.parent.question];
    if (p && !p.deferred && p.choice?.startsWith("v:") && !c.ref.parent.variants.includes(p.choice.slice(2))) return { open: false, na: true, label: "Not applicable", cls: "dashed" };
  }
  if (!d) return OPEN;
  if (d.deferred) return { open: false, deferred: true, label: "Deferred", cls: "dashed", answer: d.text.trim() };
  const text = d.text.trim();
  if (c.kind === "fact" || c.kind === "evidence" || (c.kind === "decision" && !c.ref.variants.length)) return text ? { open: false, label: "Answer entered", cls: "neutral", answer: text } : OPEN;
  if (d.choice === "other") return text ? { open: false, label: "Own answer", cls: "neutral", answer: text } : { ...OPEN, label: "Open · draft" };
  const named = { fix: "Fix", nofix: "Do not fix", take: "Take", skip: "Do not take" }[d.choice];
  if (named) return { open: false, label: named, cls: "neutral", answer: named };
  if (d.choice?.startsWith("v:")) { const v = c.ref.variants.find((x) => x.id === d.choice.slice(2)); return { open: false, label: "Selected", cls: "neutral", answer: v?.text ?? d.choice.slice(2) }; }
  return OPEN;
}
const isOpen = (key) => statusOf(key).open;

function graphHtml() {
  const units = D.units, idx = new Map(units.map((u, i) => [u.name, i]));

  const rows = []; units.forEach((u, i) => (rows[row[i]] ??= []).push(i));
  const W_ = (i) => Math.max(120, units[i].name.length * 7.3 + 26), H = 46, GX = 22, GY = 56;
  const avail = Math.max(480, ($("#det-body")?.clientWidth ?? 900) - 48);
  const pos = [];

  const lines = rows.filter(Boolean).flatMap((r) => { const out = [[]]; let w = 0; for (const i of r) { if (out.at(-1).length && w + GX + W_(i) > avail) { out.push([]); w = 0; } w += (out.at(-1).length ? GX : 0) + W_(i); out.at(-1).push(i); } return out; });
  for (const line of lines) width = Math.max(width, line.reduce((s, i) => s + W_(i) + GX, -GX));
  for (const line of lines) {
    const lw = line.reduce((s, i) => s + W_(i) + GX, -GX); let x = (width - lw) / 2 + 10;
    for (const i of line) { pos[i] = { x, y, w: W_(i) }; x += W_(i) + GX; }
    y += H + GY;
  }
  const edges = [];
  units.forEach((u, i) => u.uses.forEach((name) => { const j = idx.get(name); if (j === undefined) return; const a = pos[i], b = pos[j]; const x1 = a.x + a.w / 2, y1 = a.y + H, x2 = b.x + b.w / 2, y2 = b.y; edges.push(`<path class="gedge" data-from="${i}" data-to="${j}" d="M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2 - 6}" marker-end="url(#arr)"/>`); }));
  const nodes = units.map((u, i) => {
    const p = pos[i], blocks = u.blocks.map(blk), s = verdictShares(blocks), total = Object.values(s).reduce((a, b) => a + b, 0);
    let bx = p.x, bar = "";
    if (total) for (const k of ["keep", "fix", "remove", "question"]) if (s[k]) { const w = p.w * s[k] / total; bar += `<rect class="gbar s-${k}" x="${bx}" y="${p.y + H - 4}" width="${w}" height="4" style="fill:var(--${k === "keep" ? "border-strong" : k === "fix" ? "warn-line" : k === "remove" ? "bad-line" : "q-line"})"/>`; bx += w; }
    return `<g class="gnode${u.existing ? " existing" : ""}" data-i="${i}" data-sel="unit:${i}" data-act="sel" tabindex="0" role="button" aria-label="${esc(u.name)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${H}" rx="5"/><text x="${p.x + 10}" y="${p.y + 19}">${esc(u.name)}</text><text class="gsub" x="${p.x + 10}" y="${p.y + 35}">${u.existing ? "existing code" : `${esc(W("verdict." + u.verdict))} · ${total} lines`}</text>${bar}</g>`;
  }).join("");
  return `<div class="graph-wrap"><svg id="graph" width="${width + 20}" height="${y - GY + 20}" viewBox="0 0 ${width + 20} ${y - GY + 20}" role="img" aria-label="Who uses whom: an arrow runs from a unit to what it uses"><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="garrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>${edges.join("")}${nodes}</svg></div>
    <p class="muted small" style="margin-top:6px">An arrow runs from a unit to what it uses; hover a unit to trace its edges. Dashed: code the change did not touch. The bar is the share of its lines to keep, fix, remove or ask about.</p>`;

function wireGraph() {

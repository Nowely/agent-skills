name: CI

# Every suite that needs no `codex` binary and calls no model, on both OSes: the driver has a macOS-only
# call (the managed preferences plist), and Linux is otherwise unmeasured. Every job runs on Node 24 only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entrust:
    name: entrust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 25
    # This repository is a marketplace: the workflow lives at its root, the plugin's tree does not.
    # Every path below is the plugin's own, so the whole job runs from inside it.
    defaults:
      run:
        working-directory: plugins/entrust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
    steps:
      - uses: actions/checkout@v4
        with:
          # evals/package.test.mjs compares the tree's version against an entrust@ tag on HEAD,
          # and a shallow checkout carries no tags at all.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Parsed before anything runs: a syntax error under the engine is the one failure that must
      # not arrive disguised as a broken test. The list is the directories, so a new script is covered
      # the day it is added.
      - name: Parse every shipped script under this engine
        run: for f in plugin/skills/*/scripts/*.mjs evals/*.mjs evals/lib/*.mjs; do node --check "$f"; done
      # No install step: the driver, the suites and the fixture import node: builtins only.
      # The suites that need the real `codex` or `claude` are not run here: without the binary or the
      # opt-in variable each skips, says so, and exits 0. They stay LOCAL pre-release steps (RELEASING.md):
      # they need an authenticated home and they spend real money.
      - name: Suites
        # $TMPDIR is the whole grant at --level read, and a stock Linux shell does not set it: without it
        # every read-level case is a usage error before anything is spawned. The runner context is only
        # available at step level, which is why this sits here and not on the job.
        env:
          TMPDIR: ${{ runner.temp }}
        run: node evals/run-all.mjs

  terse:
    name: terse
    # terse's scripts make no OS-specific call, so one OS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/terse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Parse every shipped script under this engine
        run: for f in plugin/skills/*/scripts/*.mjs evals/*.mjs; do node --check "$f"; done
      # The page checks (links, the run-directory line, the frozen digests) and the rewrite scripts' selftest.
      - name: Suites
        run: node evals/pages.test.mjs && node plugin/skills/rewrite/scripts/selftest.mjs

  skills:
    name: skills
    # Every plugin's skill pages against the vendor's skill rules; it reads all plugins, so it runs from the root.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Parse every repository-wide script under this engine
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Skill pages
        run: node scripts/skills.test.mjs

